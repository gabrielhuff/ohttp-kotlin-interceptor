[package]
name = "ohttp-reference-relay"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ohttp-reference-relay"
path = "src/main.rs"

[dependencies]
# Pure-Rust OHTTP relay from the payjoin project. We use the `_test-util`
# feature so we can use `listen_tcp_on_free_port`, which binds to a random
# port and returns it (the public `listen_tcp` doesn't expose the assigned
# port).
ohttp-relay = { version = "0.0.11" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
