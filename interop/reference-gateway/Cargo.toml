[package]
name = "ohttp-reference-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ohttp-reference-gateway"
path = "src/main.rs"

[dependencies]
# Spec author's OHTTP / BHTTP crates (Martin Thomson).
ohttp = { version = "0.7", default-features = false, features = ["rust-hpke", "server"] }
bhttp = { version = "0.7", default-features = false, features = ["http"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-std", "signal"] }
url = "2"
